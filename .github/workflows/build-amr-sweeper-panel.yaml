name: Build AMR Sweeper Foxglove Panel

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build AMR sweeper panel
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: amr-sweeper-panel

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: amr-sweeper-panel/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint Foxglove panel
        run: npm run lint

      - name: Build Foxglove panel
        run: npm run build

      - name: Archive existing packaged panels
        run: |
          mkdir -p archive
          touch archive/.gitkeep
          find . -maxdepth 1 -name "*.foxe" -exec mv {} archive/ \;

      - name: Bump panel version
        if: github.event_name != 'pull_request'
        run: npm version patch --no-git-tag-version

      - name: Package Foxglove panel
        run: npm run package

      - name: List packaged files
        run: |
          find archive -maxdepth 1 -name "*.foxe" -print || true
          find . -maxdepth 1 -name "*.foxe" -print

      - name: Commit packaged panel to repository
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A .
          if git diff --cached --quiet; then
            echo "No packaged panel changes to commit."
            exit 0
          fi
          git commit -m "Update packaged AMR Sweeper Foxglove panel [skip ci]"
          git push

      - name: Upload .foxe artifact
        uses: actions/upload-artifact@v4
        with:
          name: amr-sweeper-panel
          path: amr-sweeper-panel/*.foxe
          if-no-files-found: error
