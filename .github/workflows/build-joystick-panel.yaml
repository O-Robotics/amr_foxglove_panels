name: Build Foxglove Joystick Panel

on:
  pull_request:
    paths:
      - .github/workflows/build-joystick-panel.yaml
      - amr_sweeper_joystick_panel/**
  push:
    branches:
      - main
    paths:
      - .github/workflows/build-joystick-panel.yaml
      - amr_sweeper_joystick_panel/**
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build joystick panel
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: amr_sweeper_joystick_panel

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: amr_sweeper_joystick_panel/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Foxglove panel
        run: npm run build

      - name: Create temporary changelog for packaging
        run: |
          cat <<'CHANGELOG' > CHANGELOG.md
          # Changelog

          Temporary changelog generated in CI so foxglove-extension package can build a .foxe archive.
          CHANGELOG

      - name: Archive existing packaged panels
        run: |
          mkdir -p archive
          touch archive/.gitkeep
          find . -maxdepth 1 -name "*.foxe" -exec mv {} archive/ \;

      - name: Bump panel version
        if: github.event_name != 'pull_request'
        run: npm version patch --no-git-tag-version

      - name: Package Foxglove panel
        run: npm run foxglove:package

      - name: List packaged files
        run: |
          find archive -maxdepth 1 -name "*.foxe" -print || true
          find . -maxdepth 1 -name "*.foxe" -print

      - name: Remove temporary changelog
        run: rm -f CHANGELOG.md

      - name: Commit packaged panel to repository
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A .
          if git diff --cached --quiet; then
            echo "No packaged panel changes to commit."
            exit 0
          fi
          git commit -m "Update packaged Foxglove panel [skip ci]"
          git push

      - name: Upload .foxe artifact
        uses: actions/upload-artifact@v6
        with:
          name: amr-sweeper-joystick-panel
          path: amr_sweeper_joystick_panel/*.foxe
          if-no-files-found: error
