<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">AMR Sweeper motion preview</title>
  <desc id="desc">Top-view AMR Sweeper preview showing forward/backward wheel arrows, clockwise/counterclockwise brush arrows, and a latched bright red safety stop button.</desc>
  <defs>
    <radialGradient id="stopGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ff0000" stop-opacity="0.95" />
      <stop offset="0.55" stop-color="#ff0000" stop-opacity="0.38" />
      <stop offset="1" stop-color="#ff0000" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="body" x1="0" x2="1">
      <stop offset="0" stop-color="#9ca3af" />
      <stop offset="0.5" stop-color="#d4d7e5" />
      <stop offset="1" stop-color="#9ca3af" />
    </linearGradient>
    <pattern id="tread" width="10" height="18" patternUnits="userSpaceOnUse">
      <rect width="10" height="18" fill="#facc15" />
      <rect y="2" width="10" height="3" fill="#fef08a" opacity="0.85" />
    </pattern>
    <marker id="wheelArrowHead" markerWidth="14" markerHeight="14" refX="7" refY="7" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 14 7 L 0 14 z" fill="#38bdf8" />
    </marker>
    <marker id="brushArrowHead" markerWidth="14" markerHeight="14" refX="7" refY="7" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 14 7 L 0 14 z" fill="#f97316" />
    </marker>
  </defs>

  <rect width="1600" height="1000" fill="#000" />
  <text x="800" y="76" fill="#e2e8f0" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="42" font-weight="800">AMR Sweeper panel motion preview</text>

  <g transform="translate(502 150) scale(1.15)">
    <g id="left-brush" transform="translate(122 165)">
      <g stroke="#dc2626" stroke-width="3" stroke-linecap="round">
        <line x1="0" y1="-40" x2="0" y2="-106" />
        <line x1="15" y1="-37" x2="40" y2="-103" />
        <line x1="28" y1="-28" x2="75" y2="-82" />
        <line x1="37" y1="-15" x2="102" y2="-42" />
        <line x1="40" y1="0" x2="106" y2="0" />
        <line x1="37" y1="15" x2="102" y2="42" />
        <line x1="28" y1="28" x2="75" y2="82" />
        <line x1="15" y1="37" x2="40" y2="103" />
        <line x1="0" y1="40" x2="0" y2="106" />
        <line x1="-15" y1="37" x2="-40" y2="103" />
        <line x1="-28" y1="28" x2="-75" y2="82" />
        <line x1="-37" y1="15" x2="-102" y2="42" />
        <line x1="-40" y1="0" x2="-106" y2="0" />
        <line x1="-37" y1="-15" x2="-102" y2="-42" />
        <line x1="-28" y1="-28" x2="-75" y2="-82" />
        <line x1="-15" y1="-37" x2="-40" y2="-103" />
      </g>
      <circle r="54" fill="rgba(127,29,29,0.35)" stroke="#b91c1c" stroke-width="2" />
    </g>

    <g id="right-brush" transform="translate(398 165)">
      <use href="#left-brush" transform="translate(-122 -165)" />
    </g>

    <path d="M 169 165 A 82 82 0 1 0 80 105" fill="none" stroke="#f97316" stroke-width="9" stroke-linecap="round" marker-end="url(#brushArrowHead)" />
    <text x="122" y="35" fill="#fed7aa" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="800">CCW</text>
    <path d="M 445 165 A 82 82 0 1 1 360 105" fill="none" stroke="#f97316" stroke-width="9" stroke-linecap="round" marker-end="url(#brushArrowHead)" />
    <text x="398" y="35" fill="#fed7aa" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="800">CW</text>

    <path d="M135 90 Q135 45 185 45 L335 45 Q385 45 385 90 L385 210 Q385 288 352 382 L337 520 Q332 575 282 592 L238 592 Q188 575 183 520 L168 382 Q135 288 135 210 Z" fill="url(#body)" stroke="#6b7280" stroke-width="5" />
    <path d="M230 48 L290 48 Q305 230 292 520 L228 520 Q215 230 230 48 Z" fill="#e2e8f0" opacity="0.32" />

    <rect x="86" y="360" width="56" height="142" rx="14" fill="url(#tread)" stroke="#fde047" stroke-width="5" />
    <rect x="378" y="360" width="56" height="142" rx="14" fill="url(#tread)" stroke="#fde047" stroke-width="5" />
    <line x1="80" y1="492" x2="80" y2="370" stroke="#38bdf8" stroke-width="10" stroke-linecap="round" marker-end="url(#wheelArrowHead)" />
    <line x1="440" y1="370" x2="440" y2="492" stroke="#38bdf8" stroke-width="10" stroke-linecap="round" marker-end="url(#wheelArrowHead)" />

    <rect x="142" y="422" width="236" height="58" fill="#334155" opacity="0.82" />
    <circle cx="260" cy="451" r="32" fill="#9ca3af" stroke="#334155" stroke-width="4" />
    <rect x="214" y="498" width="16" height="48" rx="8" fill="#fde047" />
    <rect x="290" y="498" width="16" height="48" rx="8" fill="#fde047" />

    <circle cx="260" cy="290" r="76" fill="url(#stopGlow)" />
    <g class="stop-button latched">
      <rect x="216" y="268" width="88" height="44" rx="12" fill="#ff0000" stroke="#fecaca" stroke-width="5" />
      <text x="260" y="297" fill="#fff" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="900">STOP</text>
    </g>
  </g>

  <text x="800" y="930" fill="#94a3b8" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="26">Example: left wheel forward, right wheel backward; left brush CCW, right brush CW; safety stop latched</text>
</svg>
